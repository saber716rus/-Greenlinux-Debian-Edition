# GLDE isolinux config (override live-build шаблона).
# Отличия от шаблона:
#   - timeout 100 (10 c): автозагрузка live-системы
#     (штатный шаблон live-build ставит timeout 0 = ждать вечно)
#   - SERIAL 0 115200: меню загрузки дублируется в serial-консоль
#     (консоль CI-тестирования; на реальном железе безвредно)

SERIAL 0 115200
include menu.cfg
default vesamenu.c32
prompt 0
timeout 100
