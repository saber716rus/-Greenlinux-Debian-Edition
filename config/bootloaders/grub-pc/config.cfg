# GLDE grub config (override live-build шаблона).
# Отличия от шаблона:
#   - set timeout=10: автозагрузка live-системы через 10 секунд
#     (штатный шаблон live-build ждёт Enter бесконечно — как на Debian live;
#      для CI-тестирования и UX в стиле Mint нужен таймаут)
#   - отключён стартовый "звук" GRUB

set default=0
set timeout=10
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=1024x768
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
