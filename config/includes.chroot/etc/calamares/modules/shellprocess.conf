# Remove live-session leftovers from the target system.
# Runs inside the target (chroot) during the exec phase.
---
dontChroot: false
timeout: 300

script:
    - "rm -f /etc/lightdm/lightdm.conf.d/70-glde-live-autologin.conf"
    - "rm -f /etc/polkit-1/localauthority/50-local.d/45-glde-live.pkla"
    - "rm -f /etc/xdg/autostart/glde-live-terminal.desktop"
    - "rm -f /etc/machine-id || true"
