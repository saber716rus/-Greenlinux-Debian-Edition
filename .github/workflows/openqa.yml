name: openqa

# Тестирование GLDE через openQA (os-autoinst):
#
# 1) job `isotovideo` — ядро os-autoinst (тот же движок, что и в openQA)
#    в контейнере openqa_worker; работает на GitHub-раннерах (QEMU TCG, без KVM).
#    Выполняет те же тесты, что и полный openQA.
#
# 2) job `openqa-full` — полный стек openQA в ОДНОМ контейнере
#    openqa-single-instance (db + webui + scheduler + worker, API без авторизации).
#    Опция `run_full_stack`. Для скорости лучше self-hosted раннер с KVM
#    (замените runs-on на [self-hosted, openqa]).
#
# Пользователь live-сессии ISO: glde / glde (см. bootappend-live).

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Имя артефакта с ISO'
        required: false
        default: 'glde-iso'
      run_full_stack:
        description: 'Запустить и полный openQA-стек'
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  WORKER_IMAGE: registry.opensuse.org/devel/openqa/containers16.0/openqa_worker
  SINGLE_INSTANCE_IMAGE: registry.opensuse.org/devel/openqa/containers/openqa-single-instance

jobs:
  isotovideo:
    name: openQA engine (isotovideo)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_name || 'glde-iso' }}
          run-id: ${{ github.event.workflow_run && github.event.workflow_run.id || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run os-autoinst tests (isotovideo in openqa-worker container)
        env:
          GLDE_WORKER_IMAGE: ${{ env.WORKER_IMAGE }}
        run: |
          set -euxo pipefail
          ls -lh
          ISO=$(ls -1 glde-*.iso | head -1)
          chmod +x openqa/run-isotovideo.sh
          ./openqa/run-isotovideo.sh "$(pwd)/${ISO}" smoke

      - name: Show test results
        if: always()
        run: |
          echo "=== autoinst-log tail ==="
          tail -50 openqa/isotovideo-out/autoinst-log.txt 2>/dev/null || true
          echo ""
          echo "=== GLDE-CHECK lines ==="
          grep -a "GLDE-CHECK" openqa/isotovideo-out/autoinst-log.txt openqa/isotovideo-out/console.log 2>/dev/null || true

      - name: Evaluate result
        if: always()
        run: |
          set -x
          LOGS="openqa/isotovideo-out/autoinst-log.txt openqa/isotovideo-out/console.log"
          if grep -qa "integration checks FAILED" ${LOGS} 2>/dev/null; then
            grep -a "FAILED" ${LOGS}; exit 1
          fi
          if grep -qa "Test died\|died at " ${LOGS} 2>/dev/null; then
            grep -a -A3 "died at" ${LOGS} | head -30; exit 1
          fi
          TOTAL=$(cat ${LOGS} 2>/dev/null | grep -a "GLDE-CHECK" | wc -l)
          PASS=$(cat ${LOGS} 2>/dev/null | grep -a "GLDE-CHECK" | grep -ac ": PASS")
          echo "Passed: ${PASS}/${TOTAL}"
          if [ "${TOTAL}" -lt 10 ]; then
            echo "Test run did not complete (too few checks executed)"; exit 1
          fi
          if [ "${PASS}" -ne "${TOTAL}" ]; then
            cat ${LOGS} 2>/dev/null | grep -a "GLDE-CHECK" | grep -v ": PASS" || true
            exit 1
          fi
          echo "ALL CHECKS PASSED"

      - name: Upload openQA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openqa-isotovideo-results
          retention-days: 30
          path: |
            openqa/isotovideo-out/

      - name: Summary
        if: always()
        run: |
          {
            echo "### openQA (isotovideo) — GLDE"
            echo ""
            echo '```'
            cat openqa/isotovideo-out/autoinst-log.txt openqa/isotovideo-out/console.log 2>/dev/null | grep -a "GLDE-CHECK" || echo "no results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  openqa-full:
    name: openQA full stack (single-instance)
    runs-on: ubuntu-latest   # для KVM: замените на [self-hosted, openqa]
    timeout-minutes: 360
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_stack == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.dotnet \
                       /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'glde-iso' }}
          run-id: ${{ github.event.workflow_run && github.event.workflow_run.id || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start openQA single-instance container
        run: |
          set -euxo pipefail
          docker pull "${SINGLE_INSTANCE_IMAGE}"
          docker run -d --name openqa-si --privileged \
            -p 127.0.0.1:8080:80 \
            -v /var/lib/openqa \
            "${SINGLE_INSTANCE_IMAGE}"
          # Ждём health-check (bootstrap поднимает db+webui+scheduler+worker)
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "openQA web UI is up"; break
            fi
            sleep 10
          done
          curl -sf http://127.0.0.1:8080/api/v1/jobs >/dev/null || {
            docker logs openqa-si | tail -80; echo "openQA did not come up"; exit 1;
          }

      - name: Deploy GLDE test distribution and ISO asset
        run: |
          set -euxo pipefail
          ISO=$(ls -1 glde-*.iso | head -1)
          ISO_BASE=$(basename "${ISO}")
          echo "ISO_BASE=${ISO_BASE}" >> "$GITHUB_ENV"
          docker exec openqa-si mkdir -p /var/lib/openqa/share/tests/glde /var/lib/openqa/share/factory/iso
          docker cp openqa/main.pm     openqa-si:/var/lib/openqa/share/tests/glde/main.pm
          docker cp openqa/lib         openqa-si:/var/lib/openqa/share/tests/glde/lib
          docker cp openqa/tests       openqa-si:/var/lib/openqa/share/tests/glde/tests
          docker cp openqa/templates   openqa-si:/var/lib/openqa/share/tests/glde/templates
          docker cp openqa/vars.json   openqa-si:/var/lib/openqa/share/tests/glde/vars.json
          docker cp "${ISO}"           openqa-si:/var/lib/openqa/share/factory/iso/${ISO_BASE}
          docker exec openqa-si chown -R _openqa-worker: /var/lib/openqa/share/factory/iso 2>/dev/null || true
          docker exec openqa-si ls -la /var/lib/openqa/share/tests/glde/

      - name: Trigger openQA job (API без авторизации — bootstrap включает method=None)
        run: |
          set -euxo pipefail
          RESPONSE=$(curl -sS -X POST http://127.0.0.1:8080/api/v1/jobs \
            -F DISTRI=glde \
            -F VERSION=09.2026 \
            -F FLAVOR=dev \
            -F ARCH=x86_64 \
            -F TEST=smoke \
            -F BUILD=draft \
            -F QEMURAM=4096 \
            -F QEMUCPUS=2 \
            -F "GLDE_BOOT_TIMEOUT=2400" \
            -F "ISO=${ISO_BASE}")
          echo "${RESPONSE}"
          JOB_ID=$(echo "${RESPONSE}" | jq -r '.job.id // empty')
          if [ -z "${JOB_ID}" ]; then
            echo "Failed to create openQA job"; docker logs openqa-si | tail -50; exit 1
          fi
          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"
          echo "openQA job created: ${JOB_ID} (http://127.0.0.1:8080/tests/${JOB_ID})"

      - name: Wait for openQA job result
        run: |
          set -euxo pipefail
          echo "Waiting for job ${JOB_ID} (без KVM — TCG, может занять до 2 часов)..."
          for i in $(seq 1 720); do
            JSON=$(curl -sS "http://127.0.0.1:8080/api/v1/jobs/${JOB_ID}" || echo '{}')
            STATE=$(echo "${JSON}" | jq -r '.job.state // "unknown"')
            RESULT=$(echo "${JSON}" | jq -r '.job.result // "none"')
            echo "[${i}] state=${STATE} result=${RESULT}"
            if [ "${STATE}" = "done" ]; then
              if [ "${RESULT}" = "passed" ]; then
                echo "JOB PASSED"; exit 0
              else
                echo "JOB ${RESULT}"; exit 1
              fi
            fi
            sleep 15
          done
          echo "Timeout waiting for job"; exit 1

      - name: Collect results
        if: always()
        run: |
          set -x
          mkdir -p openqa-results
          [ -n "${JOB_ID:-}" ] && docker cp openqa-si:/var/lib/openqa/share/testresults/${JOB_ID} openqa-results/job-${JOB_ID} 2>/dev/null || true
          [ -n "${JOB_ID:-}" ] && curl -sS "http://127.0.0.1:8080/api/v1/jobs/${JOB_ID}/details" -o openqa-results/details.json 2>/dev/null || true
          docker logs openqa-si > openqa-results/container.log 2>&1 || true
          docker exec openqa-si ls -la /var/lib/openqa/share/testresults/ > openqa-results/testresults-listing.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openqa-full-results
          retention-days: 30
          path: openqa-results/
